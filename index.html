<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#14101c"><title>Pump.fun paper bot · PAPER TEST</title>
<style>
:root{--bg1:#14101c;--bg2:#1c1426;--bg3:#101a20;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.08);--tx:#ece6f2;--mut:#9a90a8;--acc:#e8b4a0;--g:#5fd69a;--a:#f2b45a;--r:#f06a6a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--tx);min-height:100vh;
background:linear-gradient(130deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:300% 300%;animation:bg 24s ease infinite;
padding:max(14px,env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.wrap{max-width:980px;margin:0 auto}
.banner{background:linear-gradient(90deg,#5a2a1e,#6b3524);border:1px solid #a0583c;color:#ffd9c6;padding:10px 14px;border-radius:14px;font-weight:600;font-size:13px;text-align:center;letter-spacing:.02em}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 12px;flex-wrap:wrap}
h1{font-family:Georgia,"Iowan Old Style",serif;font-weight:500;font-size:26px;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:inherit;font-size:12px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.badge{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.08em;border:1px solid currentColor;animation:glow 2.6s ease-in-out infinite}
.badge.g{color:var(--g)}.badge.a{color:var(--a)}.badge.r{color:var(--r)}
@keyframes glow{0%,100%{box-shadow:0 0 6px -2px currentColor}50%{box-shadow:0 0 20px 2px currentColor}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
opacity:0;transform:translateY(14px);animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.val{font-size:24px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.pos{color:var(--g)}.neg{color:var(--r)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--mut);position:relative}
.dot.on{background:var(--g)}.dot.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--g);animation:ping 1.8s ease-out infinite}
.dot.off{background:var(--r)}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
.sec{margin-top:12px}.sec h2{font-family:Georgia,serif;font-weight:500;font-size:17px;margin:0 0 10px}
svg{width:100%;height:120px;display:block}
.line{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.03);font-size:12.5px;
opacity:0;transform:translateX(-10px);animation:in .5s ease forwards}
.mint{font-family:ui-monospace,Menlo,monospace;color:#cbbfd8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t{color:var(--mut);font-size:11px;white-space:nowrap}
.pill{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:700;letter-spacing:.05em;background:rgba(255,255,255,.07)}
.pill.PASS,.pill.ACCEPT{color:var(--g)}.pill.REJECT,.pill.REJECTED,.pill.FAIL{color:var(--r)}.pill.UNKNOWN{color:var(--a)}
.why{grid-column:1/-1;color:var(--mut);font-size:11px}
.empty{color:var(--mut);font-size:13px;padding:8px 2px}
footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:18px}footer a{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card,.row{opacity:1;transform:none}.line{stroke-dashoffset:0}}
</style></head><body><div class=wrap>
<div class=banner>PAPER TEST ONLY · simulated $100 · no real money · no wallet · no real orders</div>
<header><h1>Pump.fun paper bot<small>live paper dashboard</small></h1><span id=badge class="badge a">…</span></header>
<div class=grid>
<div class=card style="animation-delay:.05s"><div class=lbl>Cash</div><div class=val id=cash>$0.00</div></div>
<div class=card style="animation-delay:.12s"><div class=lbl>Today P&amp;L</div><div class=val id=pnl>$0.00</div></div>
<div class=card style="animation-delay:.19s"><div class=lbl>Trades</div><div class=val id=nt>0</div></div>
<div class=card style="animation-delay:.26s"><div class=lbl>Feed</div><div class=val style="font-size:17px"><span id=dot class=dot></span><span id=ws>…</span></div><div class=t id=hb></div></div>
</div>
<div class="card sec" style="animation-delay:.33s"><h2>Equity</h2><div id=chart></div><div class=t id=posn></div></div>
<div class="card sec" style="animation-delay:.4s"><h2>Trades</h2><div class=list id=trades></div></div>
<div class="card sec" style="animation-delay:.47s"><h2>Rug-check verdicts</h2><div class=list id=verd></div></div>
<div class="card sec" style="animation-delay:.54s"><h2>Discovered tokens</h2><div class=list id=disc></div></div>
<footer id=foot>loading…</footer></div>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,$=id=>document.getElementById(id),
E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
T=u=>u?new Date(u*1000).toLocaleString('en-US',{timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+' Manila':'-',
N=v=>{const n=parseFloat(v);return isFinite(n)?n:0};let prev={},seen=new Set();
function count(el,to,fmt){const from=prev[el.id]??0;prev[el.id]=to;if(RM||from===to){el.textContent=fmt(to);return}
const t0=performance.now(),d=900;(function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
const usd=v=>(v<0?'-$':'$')+Math.abs(v).toFixed(2),sgn=v=>(v>0?'+':'')+usd(v);
function rows(el,items,html,key){if(!items.length){el.innerHTML='<div class=empty>Nothing yet</div>';return}
el.innerHTML=items.map((x,i)=>{const k=key(x),fresh=!seen.has(k);seen.add(k);return `<div class=row style="animation-delay:${fresh?Math.min(i,12)*45:0}ms${fresh?'':';animation-duration:0s'}">${html(x)}</div>`}).join('')}
function chart(tr){const el=$('chart');let eq=100,pts=[100];tr.forEach(t=>{eq+=N(t.pnl??t.pnl_net??t.realized);pts.push(eq)});
if(pts.length<2){el.innerHTML='<div class=empty>Flat at $100 · the chart draws itself once trades close</div>';return}
const w=600,h=120,mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1,p=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-8-(v-mn)/r*(h-16)).toFixed(1)}`).join(' ');
el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio=none><polyline class=line points="${p}"/></svg>`}
async function load(){try{const s=await (await fetch('status.json?'+Date.now(),{cache:'no-store'})).json(),a=s.account||{},hb=s.heartbeat||{};
const st=(s.halted?'HALTED':s.stopped?'STOPPED':(a.state||hb.state||'?')).toUpperCase(),b=$('badge');b.textContent=st;
b.className='badge '+(st==='ACTIVE'?'g':st==='WAIT'?'a':'r');
count($('cash'),N(a.cash),usd);const pl=N(a.day_realized),pe=$('pnl');count(pe,pl,sgn);pe.className='val '+(pl>0?'pos':pl<0?'neg':'');
count($('nt'),N(s.trade_count),v=>Math.round(v));
const on=hb.ws==='connected'&&Date.now()/1000-(hb.unix||0)<600;$('dot').className='dot '+(on?'on':'off');$('ws').textContent=hb.ws||'unknown';$('hb').textContent='heartbeat '+T(hb.unix);
$('posn').textContent='Position: '+(a.position?JSON.stringify(a.position):'none')+(a.halt_reason?' · halt: '+a.halt_reason:'');
const tr=s.trades||[];chart(tr);
rows($('trades'),tr.slice().reverse(),x=>{const v=N(x.pnl??x.pnl_net??x.realized);return `<span class="pill ${v>=0?'PASS':'FAIL'}">${sgn(v)}</span><span class=mint>${E(x.symbol||x.mint)}</span><span class=t>${T(x.exit_unix||x.unix)}</span>${x.reason?`<span class=why>${E(x.reason)}</span>`:''}`},x=>'t'+JSON.stringify(x));
rows($('verd'),(s.verdicts||[]).slice().reverse(),x=>`<span class="pill ${E(x.outcome)}">${E(x.outcome)}</span><span class=mint>${E(x.mint)}</span><span class=t>${T(x.unix)}</span>${(x.reasons||[]).length?`<span class=why>${E(x.reasons.join(' · '))}</span>`:''}`,x=>'v'+x.mint+x.unix);
rows($('disc'),(s.discovery||[]).slice().reverse(),x=>`<span class=pill>${E(x.disposition)}</span><span class=mint>${E(x.symbol?x.symbol+' · ':'')}${E(x.mint)}</span><span class=t>${T(x.unix)}</span>`,x=>'d'+x.mint+x.unix);
$('foot').innerHTML=`${E(s.mode)}<br>published ${T((s.published_at||0)/1000)} · refreshes every 60s · <a href=status.json>status.json</a>`}
catch(e){$('foot').textContent='Could not load status.json, retrying in 60s'}}
load();setInterval(load,60000);
</script></body></html>
